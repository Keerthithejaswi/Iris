name: Add submission to Iris

on:
  issues:
    types: [opened, edited, labeled, unlabeled]

concurrency:
  group: iris-data
  cancel-in-progress: false

jobs:
  add:
    # Adds/updates submissions from repo collaborators, or from anyone once a maintainer adds the "approved" label.
    # Removing the "submission" label removes the entry from the site.
    if: >-
      (github.event.action == 'unlabeled' && github.event.label.name == 'submission') ||
      (github.event.action != 'unlabeled' &&
       contains(github.event.issue.labels.*.name, 'submission') &&
       (github.event.action != 'labeled' || github.event.label.name == 'approved') &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
        contains(github.event.issue.labels.*.name, 'approved')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Parse issue and update data/projects.json
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/add-project.js');
            const result = await run({ context });
            core.info(JSON.stringify(result));
            return result;

      - name: Commit and push
        id: commit
        env:
          TITLE: ${{ fromJSON(steps.parse.outputs.result).title }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "Iris: ${TITLE} (#${ISSUE})"
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment and close
        if: fromJSON(steps.parse.outputs.result).action == 'added'
        uses: actions/github-script@v7
        env:
          PROJECT_ID: ${{ fromJSON(steps.parse.outputs.result).id }}
        with:
          script: |
            const site = `https://${context.repo.owner.toLowerCase()}.github.io/${context.repo.repo}/#${encodeURIComponent(process.env.PROJECT_ID)}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `✨ Added to Iris! It'll be live in a minute or two: ${site}\n\nNeed to change something? Edit this issue and the site updates automatically.`,
            });
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed' });

  deploy:
    needs: add
    if: needs.add.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  pending:
    # Submissions from people outside the repo wait for a maintainer to add the "approved" label.
    if: >-
      github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'submission') &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '👋 Thanks! A maintainer will review this. It goes live once they add the `approved` label.',
            });
