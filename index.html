<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iris — UX Showcase</title>
  <meta name="description" content="A showcase and directory of the UX team's POCs, Figma files and prototypes." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%237c5cff'/><circle cx='50' cy='50' r='16' fill='white'/></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./" aria-label="Iris home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Iris</span>
      </a>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">◐</button>
        <a class="btn btn-primary" id="submit-link" href="#" target="_blank" rel="noopener">+ Submit work</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Everything the UX team is building.</h1>
      <p>POCs, Figma files and prototypes in one place. Browse, search and get inspired.</p>
      <div class="stats" id="stats" aria-live="polite"></div>
    </section>

    <section class="toolbar" aria-label="Filters">
      <div class="search">
        <input id="search" type="search" placeholder="Search by title, designer, tag…" autocomplete="off" aria-label="Search projects" />
        <kbd>/</kbd>
      </div>
      <div class="selects">
        <select id="filter-team" aria-label="Filter by team"><option value="">All teams</option></select>
        <select id="filter-status" aria-label="Filter by status"><option value="">Any status</option></select>
        <select id="sort" aria-label="Sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A → Z</option>
        </select>
      </div>
    </section>

    <nav class="chips" id="type-chips" aria-label="Filter by type"></nav>
    <div class="chips tag-chips" id="tag-chips" aria-label="Filter by tag"></div>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>No projects match your filters. <button class="link-btn" id="clear-filters" type="button">Clear filters</button></p>
  </main>

  <footer class="site-footer wrap">
    <span>Iris · UX Showcase</span>
    <a id="repo-link" href="#" target="_blank" rel="noopener">View on GitHub</a>
  </footer>

  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <button class="icon-btn close" id="detail-close" type="button" aria-label="Close">✕</button>
    <div id="detail-body"></div>
  </dialog>

  <script src="assets/app.js" defer></script>
</body>
</html>
